services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: job_portal_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: "5432"
      DEBUG: "True"
      SECRET_KEY: django-insecure-docker-dev-key
      ALLOWED_HOSTS: localhost,127.0.0.1,server
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "3000:5173"
    depends_on:
      - server

volumes:
  postgres_data:
